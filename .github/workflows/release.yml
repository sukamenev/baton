name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Cross-Platform Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run unit tests
        run: go test -v ./...

      - name: Cross-compile binaries and generate SHA-256 checksums
        run: |
          mkdir -p dist
          targets=(
            "linux amd64 baton_linux_amd64"
            "linux arm64 baton_linux_arm64"
            "darwin amd64 baton_darwin_amd64"
            "darwin arm64 baton_darwin_arm64"
            "windows amd64 baton_windows_amd64.exe"
            "windows arm64 baton_windows_arm64.exe"
          )
          for target in "${targets[@]}"; do
            read -r goos goarch out <<< "$target"
            echo "Building $out ($goos/$goarch)..."
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags="-s -w" -o "dist/$out" .
          done
          cd dist
          sha256sum baton_* > checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/baton_linux_amd64
            dist/baton_linux_arm64
            dist/baton_darwin_amd64
            dist/baton_darwin_arm64
            dist/baton_windows_amd64.exe
            dist/baton_windows_arm64.exe
            dist/checksums.txt
